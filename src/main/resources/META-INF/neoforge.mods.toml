[[mods]]
modId="yes_bsl"
version="1.0.0"
displayName="YES BSL"
logoFile="icon.png"
description='''
独立的兼容修复模组，解决 BSL Shaders 开启 "Advanced Materials" 后，
由 native / 自定义渲染管线写入顶点的模组模型出现半透明闪烁的问题。

当前针对 Yes Steve Model (YSM) 验证，覆盖玩家模型与第一人称手模。
不修改 BSL 光影包，也不修改目标模组的任何文件；不依赖反射。

以 MIT 协议开源，可自由修改与分发，仅需保留原作者署名。
详细原理与适配指引见项目 README。
'''

[[mixins]]
config="yes_bsl.mixins.json"

[[mixins]]
config="yes_bsl.iris.mixins.json"

[[dependencies.yes_bsl]]
modId="neoforge"
type="required"
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

[[dependencies.yes_bsl]]
