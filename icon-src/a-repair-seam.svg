    <rect x="403" y="67" width="7" height="7"/>
    <rect x="403" y="74" width="7" height="7"/>
  </g>
  <g fill="#FFFFFF">
        <rect x="67" y="32" width="28" height="7"/>
    <rect x="67" y="39" width="7" height="7"/>
    <rect x="95" y="39" width="7" height="7"/>
