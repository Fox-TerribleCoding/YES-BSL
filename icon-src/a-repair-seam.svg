    <rect x="305" y="81" width="7" height="7"/>
    <rect x="354" y="46" width="21" height="7"/>
    <rect x="375" y="53" width="7" height="7"/>
    <rect x="354" y="60" width="28" height="7"/>
    <rect x="347" y="67" width="7" height="7"/>
    <rect x="375" y="67" width="7" height="7"/>
    <rect x="354" y="74" width="28" height="7"/>
    <rect x="389" y="32" width="7" height="7"/>
    <rect x="389" y="46" width="7" height="7"/>
    <rect x="389" y="53" width="7" height="7"/>
    <rect x="389" y="60" width="7" height="7"/>
    <rect x="389" y="67" width="7" height="7"/>
    <rect x="389" y="74" width="7" height="7"/>
    <rect x="403" y="46" width="7" height="7"/>
    <rect x="417" y="46" width="14" height="7"/>
    <rect x="403" y="53" width="14" height="7"/>
