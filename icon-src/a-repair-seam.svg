    <rect x="151" y="67" width="7" height="7"/>
    <rect x="151" y="74" width="35" height="7"/>
    <rect x="221" y="32" width="28" height="7"/>
    <rect x="221" y="39" width="7" height="7"/>
    <rect x="249" y="39" width="7" height="7"/>
    <rect x="221" y="46" width="28" height="7"/>
    <rect x="221" y="53" width="7" height="7"/>
    <rect x="249" y="53" width="7" height="7"/>
    <rect x="221" y="60" width="7" height="7"/>
    <rect x="249" y="60" width="7" height="7"/>
    <rect x="221" y="67" width="7" height="7"/>
    <rect x="249" y="67" width="7" height="7"/>
    <rect x="221" y="74" width="7" height="7"/>
    <rect x="249" y="74" width="7" height="7"/>
    <rect x="270" y="46" width="21" height="7"/>
